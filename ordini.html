<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Storico Ordini</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <style>
    body { font-family: sans-serif; padding:20px; }
    .controls { margin-bottom:20px; display:flex; gap:10px; align-items:center; }
    .order-list { border-collapse: collapse; width:100%; }
    .order-list th, .order-list td { border:1px solid #ddd; padding:8px; }
    .order-row { cursor:pointer; background:#fafafa; }
    .order-row:hover { background:#f0f0f0; }
    
    
  </style>
</head>
<body class="container my-4">
  <h1 class="mb-3">Storico Ordini</h1>
  <p>
    <a href="#daily-summary" class="btn btn-primary">Vai al riepilogo del giorno ↓</a>
  </p>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <button id="prev-day" class="btn btn-secondary">← Giorno precedente</button>
    <span id="current-date" class="fw-bold"></span>
    <button id="next-day" class="btn btn-secondary">Giorno successivo →</button>
  </div>

  <!-- accordion per ordini -->
  <div class="accordion" id="orders-accordion">
  <!-- Qui lo script JS inietterà gli ordini -->
</div>


  <h2 id="daily-summary" class="mt-5">Riepilogo del giorno</h2>
  <div id="summary-day" class="mt-3"></div>

  <script type="module" src="js/firebase-init.js"></script>
  <script type="module" src="js/ordini.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>


</html>
