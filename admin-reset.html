<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Reset Database (Admin)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/auth.js"></script>
</head>
<body class="container py-4">
  <h1 class="mb-4">Reset Database (Admin)</h1>

  <div class="alert alert-warning">
    <strong>Attenzione:</strong> questa operazione elimina <u>tutti</u> gli ordini (Bar e Cucina) e azzera i contatori.  
    <br/>Usala solo in ambiente di test o con piena consapevolezza.
  </div>

  <div class="mb-3">
    <label for="admin-pass" class="form-label">Password di conferma</label>
    <input type="password" id="admin-pass" class="form-control" placeholder="Inserisci password" />
  </div>

  <div class="d-flex gap-2 mb-3">
    <button id="btn-reset" class="btn btn-danger">Reset DB</button>
    <button id="btn-check" class="btn btn-outline-secondary">Conteggio attuale</button>
  </div>

  <div id="status" class="mb-3"></div>
  <pre id="log" class="bg-light p-3 rounded" style="min-height:140px; max-height:50vh; overflow:auto;"></pre>

  <!-- Firebase init e script -->
  <script type="module" src="js/firebase-init.js"></script>
  <script type="module" src="js/reset.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
