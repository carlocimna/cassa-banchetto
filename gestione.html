<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Gestione Ordini</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/auth.js"></script>
  <style>
    body { font-family: sans-serif; padding:20px; }
    .controls { margin-bottom:20px; }
    .orders-list { display:flex; flex-direction:column; gap:12px; }
    .order-card { padding:12px; border:1px solid #ddd; border-radius:6px; background:#fafafa; }
    .order-card h3 { margin:0 0 6px; font-size:1.1rem; }
    .order-card ul { list-style:none; padding-left:0; margin:0; }
    .order-card ul li { font-size:0.9rem; }
    #items-summary { max-height:80vh; overflow-y:auto; }
    #items-summary h4 { margin-top:0; }
  </style>
</head>
<body>
  <h1 class="mb-3">Gestione Ordini</h1>
  <div class="controls">
    <button id="btn-cucina" class="btn btn-primary">Cucina</button>
    <button id="btn-bar" class="btn btn-secondary">Bar</button>
  </div>

  <div class="d-flex">
    <div id="orders-panel" class="orders-list" style="flex:2;"></div>
    <div id="items-summary" style="flex:1; padding-left:20px; border-left:1px solid #ccc;"></div>
  </div>

  <script type="module" src="js/firebase-init.js"></script>
  <script type="module" src="js/gestione.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
